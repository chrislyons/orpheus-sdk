name: Orpheus SDK CI Pipeline

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.4'
  CMAKE_VERSION: '3.27.x'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  # ============================================================================
  # C++ Build and Test (All Platforms)
  # ============================================================================
  cpp-build-test:
    name: C++ Build & Test (${{ matrix.os }}, ${{ matrix.build_type }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-latest
            generator: 'Unix Makefiles'
            sanitizers: ON
          - os: macos-latest
            generator: 'Unix Makefiles'
            sanitizers: ON
        # macOS runners bill at 10x. Keep the sanitizer-bearing Debug leg (the
        # platform-specific value) and drop macOS Release — Ubuntu already covers
        # Release, so the second 10x leg was near-redundant. Halves macOS spend.
        exclude:
          - os: macos-latest
            build_type: Release

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Install libsndfile (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsndfile1-dev

      - name: Install libsndfile (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "Installing libsndfile via Homebrew..."
          brew install libsndfile

          # Verify installation
          if ! brew list libsndfile &>/dev/null; then
            echo "ERROR: libsndfile installation failed"
            exit 1
          fi

          echo "libsndfile installed successfully"
          pkg-config --modversion sndfile || echo "Note: pkg-config not finding sndfile (may use find_library fallback)"

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@d06b37b47cfd043ec794ffa3e40e0b6b5858a7ec  # v1
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure CMake
        run: |
          SANITIZER_ARG="-DORP_ENABLE_ASAN=OFF -DORP_ENABLE_UBSAN=OFF"
          if [ "${{ matrix.build_type }}" == "Debug" ] && [ "${{ matrix.sanitizers }}" == "ON" ]; then
            SANITIZER_ARG="-DORP_ENABLE_ASAN=ON -DORP_ENABLE_UBSAN=ON"
          fi

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -G "${{ matrix.generator }}" \
            -DORPHEUS_ENABLE_REALTIME=ON \
            $SANITIZER_ARG \
            2>&1 | tee cmake_output.log
        shell: bash

      - name: Verify libsndfile detection
        run: |
          echo "Checking CMake output for libsndfile detection..."

          if grep -q "✓ libsndfile FOUND" cmake_output.log; then
            echo "✓ SUCCESS: libsndfile detected - audio file reading enabled"
          elif grep -q "✗ libsndfile NOT FOUND" cmake_output.log; then
            echo "❌ FAILURE: libsndfile NOT detected - using stub implementation"
            echo ""
            echo "This will cause 8 transport tests to fail with NotReady error:"
            echo "  - fade_processing_test"
            echo "  - out_point_enforcement_test"
            echo "  - multi_clip_stress_test"
            echo "  - clip_gain_test"
            echo "  - clip_loop_test"
            echo "  - clip_metadata_test"
            echo "  - clip_restart_test"
            echo "  - clip_seek_test"
            echo ""
            echo "Debug info:"
            echo "Platform: ${{ matrix.os }}"
            echo "CMake toolchain file: ${CMAKE_TOOLCHAIN_FILE:-not set}"
            grep -i "sndfile" cmake_output.log || echo "No sndfile mentions in CMake output"
            exit 1
          else
            echo "⚠ WARNING: Could not determine libsndfile detection status"
            echo "Checking for warning messages..."
            grep -i "libsndfile not found" cmake_output.log || echo "No explicit 'not found' message"
            exit 1
          fi
        shell: bash

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
        timeout-minutes: 10

      - name: Test
        run: |
          if [ "${{ matrix.build_type }}" == "Debug" ] && [ "${{ matrix.sanitizers }}" == "ON" ]; then
            ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
              ctest --test-dir build --output-on-failure --build-config ${{ matrix.build_type }}
          else
            ctest --test-dir build --output-on-failure --build-config ${{ matrix.build_type }}
          fi
        shell: bash
        timeout-minutes: 10

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ctest-logs-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/CTestCostData.txt
          if-no-files-found: ignore

  # ============================================================================
  # C++ Build & Test (Windows) — on demand only
  # ============================================================================
  # Windows is NOT part of the required per-PR gate. It is currently RED on a
  # pre-existing SDK defect unrelated to CI config: the ABI core builds as DLLs
  # (ORP_BUILD_ABI_DYNAMIC forces ORP_BUILD_SHARED_CORE ON) but internal factory
  # entry points the test suite links — createPerformanceMonitor,
  # createStandalonePerformanceMonitor, createSceneManager, render_tracks — are
  # not annotated for DLL export, so consumers fail with LNK2019/LNK1120. That is
  # an SDK export-annotation fix (see the ORP handoff), not a CI-config issue.
  # Run it from the Actions tab (workflow_dispatch) to validate Windows; fold it
  # back into cpp-build-test once the export work lands.
  cpp-build-test-windows:
    name: C++ Build & Test (windows-2022, ${{ matrix.build_type }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Install libsndfile (core only, no mp3)
        run: |
          vcpkg install "libsndfile[core]:x64-windows"
          if ! vcpkg list | grep -q libsndfile; then
            echo "ERROR: libsndfile installation failed"; vcpkg list; exit 1
          fi
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
        shell: bash

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@d06b37b47cfd043ec794ffa3e40e0b6b5858a7ec  # v1
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -G "Visual Studio 17 2022" \
            -DORPHEUS_ENABLE_REALTIME=ON \
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DORP_ENABLE_ASAN=OFF -DORP_ENABLE_UBSAN=OFF
        shell: bash

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
        timeout-minutes: 15

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config ${{ matrix.build_type }}
        shell: bash
        timeout-minutes: 10

  # ============================================================================
  # C++ Linting
  # ============================================================================
  cpp-lint:
    name: C++ Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-14

      - name: Run clang-format
        run: |
          find src include -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | \
          xargs clang-format-14 --dry-run --Werror

      - name: Validate docs paths (ORP133 G6)
        run: python3 tools/docs_path_audit.py --root .

      - name: Lint Windows includes
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          ROOT = pathlib.Path('.')
          violations = []
          for path in ROOT.rglob('*'):
            if not path.is_file():
              continue
            try:
              relative = path.relative_to(ROOT)
            except ValueError:
              continue
            parts = set(relative.parts)
            if 'backup' in parts:
              continue
            if path.suffix.lower() not in {
                '.c', '.cc', '.cxx', '.cpp', '.h', '.hh', '.hpp', '.hxx', '.inl'
            }:
              continue
            try:
              text = path.read_text(encoding='utf-8')
            except UnicodeDecodeError:
              continue
            lines = text.splitlines()
            for index, line in enumerate(lines):
              if '#include <windows.h>' not in line:
                continue
              prior = lines[:index]
              if not any('#define NOMINMAX' in candidate for candidate in prior):
                violations.append(f"{path}:{index + 1}")

          if violations:
            print('Found #include <windows.h> without prior #define NOMINMAX:')
            for violation in violations:
              print(f"  {violation}")
            sys.exit(1)
          PY

      - name: Check for binary artifacts
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.base_ref }}"
          mapfile -t added < <(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}"...HEAD)
          if [ ${#added[@]} -eq 0 ]; then
            echo "No newly added files; performing repository scan instead."
          fi
          declare -a banned=(".wav" ".dll" ".exe" ".a" ".so" ".dylib" ".lib")
          declare -a violations=()
          declare -A seen=()
          for file in "${added[@]}"; do
            lower=$(printf '%s' "$file" | tr '[:upper:]' '[:lower:]')
            for ext in "${banned[@]}"; do
              if [[ "$lower" == *"${ext}" ]]; then
                if [[ -z "${seen[$file]:-}" ]]; then
                  violations+=("$file")
                  seen["$file"]=1
                fi
                break
              fi
            done
          done
          if [ ${#violations[@]} -eq 0 ]; then
            mapfile -t tracked < <(git ls-files)
            for file in "${tracked[@]}"; do
              lower=$(printf '%s' "$file" | tr '[:upper:]' '[:lower:]')
              for ext in "${banned[@]}"; do
                if [[ "$lower" == *"${ext}" ]]; then
                  if [[ -z "${seen[$file]:-}" ]]; then
                    violations+=("$file")
                    seen["$file"]=1
                  fi
                  break
                fi
              done
            done
          fi
          if [ ${#violations[@]} -ne 0 ]; then
            echo "Binary artifacts detected by CI guardrails:"
            for file in "${violations[@]}"; do
              echo "  $file"
            done
            echo "Please store binary fixtures as text (e.g. base64) instead of committing them directly."
            exit 1
          fi

  # ============================================================================
  # NOTE: TypeScript/packages-related jobs removed as packages/ archived
  # See docs/DECISION_PACKAGES.md for rationale (C++ SDK focus)
  #
  # NOTE: Clip Composer application tests removed — the app was extracted to its
  # own repository (github.com/chrislyons/clip-composer) on 2026-07-09 and now
  # consumes the SDK as a submodule. Its CI lives in that repo. See ORP131.
  # ============================================================================

  # ============================================================================
  # Status Check (Required for Branch Protection)
  # ============================================================================
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [cpp-build-test, cpp-lint]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.cpp-build-test.result }}" == "failure" ]] || [[ "${{ needs.cpp-build-test.result }}" == "cancelled" ]] || \
             [[ "${{ needs.cpp-lint.result }}" == "failure" ]] || [[ "${{ needs.cpp-lint.result }}" == "cancelled" ]]; then
            echo "❌ One or more jobs failed"
            echo "cpp-build-test: ${{ needs.cpp-build-test.result }}"
            echo "cpp-lint: ${{ needs.cpp-lint.result }}"
            exit 1
          fi
          echo "✅ All CI checks passed"
